services:
  - type: web
    name: manafold-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEV_AUTH
        sync: false
      # AI assist (M4). Leave AI_ENABLED unset/false to run without the paid
      # features (endpoints answer 503); set it true and supply ANTHROPIC_API_KEY
      # to turn them on. Startup fails naming the key if AI_ENABLED=true without
      # it. See docs/intent/ai-assist/.
      - key: AI_ENABLED
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_SUGGEST_DAILY_LIMIT
        value: "20"
      - key: AI_EXPLAIN_DAILY_LIMIT
        value: "40"
      - key: AI_MONTHLY_SPEND_USD
        value: "50"
      # True hop count of proxies that append X-Forwarded-For in front of this
      # service. Gates the ACCT-017 per-IP auth rate limiter — see
      # docs/intent/account-access/account-access-design.md § Rate limiting.
      # Set to 1 for Render's edge alone, 2 if the Next.js rewrite also appends.
      # Verify before relying on the credential-stuffing / signup-spam guard.
      - key: TRUSTED_PROXY_COUNT
        value: "1"

  # Daily Scryfall bulk-data sync. Runs the standalone cmd/cardsync binary
  # built into the same image; downloads the Oracle Cards + Default Cards
  # bulk exports and upserts them into cards / card_prints / card_rulings,
  # writing a sync_runs row. See docs/intent/card-data/.
  - type: cron
    name: manafold-cardsync
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    schedule: "0 9 * * *"
    dockerCommand: /app/cardsync
    envVars:
      - key: DATABASE_URL
        sync: false
