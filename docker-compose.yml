services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: manafold
      POSTGRES_PASSWORD: manafold
      POSTGRES_DB: manafold
    ports:
      - "5432:5432"
    volumes:
      - manafold-postgres-data:/var/lib/postgresql/data

volumes:
  manafold-postgres-data:
